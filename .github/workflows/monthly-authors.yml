name: Monthly author list update

on:
  schedule:
    # 1st of every month at 12:00 UTC
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-authors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.SCRAPER_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape author list
        run: |
          for attempt in 1 2 3; do
            if python scripts/scrape_authors.py; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Author scrape failed after $attempt full attempts."
              exit 1
            fi

            delay=$((attempt * 60))
            echo "Full scrape attempt $attempt failed; retrying in ${delay}s ..."
            sleep "$delay"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/authors.json
          if git diff --cached --quiet; then
            echo "No changes to author list."
          else
            git commit -m "chore: update local author list $(date -u +%Y-%m-%d)"
            git push
          fi
